org: giancarlodavila
service: api-web-scraping
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  memorySize: 1024
  timeout: 30
  stage: dev
  region: us-east-1
  iam:
    role: arn:aws:iam::620963888196:role/LabRole
  environment:
    TABLE_NAME:
      Ref: TablaSismosIGP

functions:
  scrape_table:
    handler: scrape_table.lambda_handler
    events:
      - http:
          path: scrape/table
          method: get
          cors: true

resources:
  Resources:
    TablaSismosIGP:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: sismos-igp-dev
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: codigo
            AttributeType: S
        KeySchema:
          - AttributeName: codigo
            KeyType: HASH

package:
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!venv/**'
    - '!__pycache__/**'
    - '!*.zip'
